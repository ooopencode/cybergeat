name: refresh-lunch

on:
  schedule:
    # 工作日北京时间 10:00-14:00 每30分钟跑一次（UTC 02:00-06:00）
    - cron: "*/30 2-6 * * 1-5"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/fetch_lunch.py"
      - ".github/workflows/refresh-lunch.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/fetch_lunch.py --out candidates.json
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      - name: commit candidates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: refresh candidates.json"
          git push
